[package]
name = "MarinExplorer"
version = "0.1.9"
edition = "2021"
description = "A lightweight Windows two-pane file manager (x86_64 + ARM64), built with Rust + egui"
build = "build.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
# To reach the native HWND of our window (for the dark title bar). Version 0.6
# is what eframe 0.31 itself uses, so it resolves to the same crate.
raw-window-handle = "0.6"
# Image decoding for the built-in preview / thumbnail grid.
# Only the formats that are actually common on Windows are compiled in.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "ico",
    "tiff",
    "webp",
    "gif",
] }
# PNG *encoding* with a real compression level (the image crate's own PNG
# encoder has no level knob). Already in the tree via `image`, so this adds
# no new download. Used by the viewer's "convert to PNG" dialog.
png = "0.18"
# Parses the Windows system fonts we load at runtime (Microsoft YaHei etc.).
# Already in the tree via egui -> ab_glyph -> owned_ttf_parser, so this
# resolves to the same version. Used to *validate* a font file before handing
# it to egui — epaint panics on an unparseable font, so we pre-check instead.
ttf-parser = "0.25"

[profile.release]
opt-level = "z"      # optimize for size
lto = true
codegen-units = 1
strip = true
