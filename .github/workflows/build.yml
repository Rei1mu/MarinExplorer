name: Build

# MarinExplorer targets Windows only, and ships three editions:
#   - x86_64-pc-windows-gnu    standard Windows x64, MinGW-w64/GCC, built on Linux
#   - x86_64-pc-windows-msvc   standard Windows x64, MSVC, built on a Windows runner
#   - aarch64-pc-windows-msvc  Windows on ARM64, MSVC, built on a Windows runner
#
# Both x64 editions run on any ordinary 64-bit Windows PC. They differ only in
# how they were compiled: GNU links the MinGW runtime, MSVC links Microsoft's
# (statically here — see the RUSTFLAGS below, so no redistributable needed).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Link the MSVC C runtime statically, so the .exe starts on a clean Windows
  # install that has no "Visual C++ Redistributable" present.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build-gnu-x86_64:
    name: Windows x64 (GNU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64 toolchain (GCC-based, matches the local build)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Stage artifact
        run: cp "target/x86_64-pc-windows-gnu/release/MarinExplorer.exe" "MarinExplorer-x64-gnu.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-x64-gnu
          path: MarinExplorer-x64-gnu.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: MarinExplorer-x64-gnu.exe

  build-msvc-x86_64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build release
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          if not defined VS (echo "Visual Studio not found" && exit /b 1)
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "target/x86_64-pc-windows-msvc/release/MarinExplorer.exe" "MarinExplorer-x64-msvc.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-x64-msvc
          path: MarinExplorer-x64-msvc.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: MarinExplorer-x64-msvc.exe

  build-msvc-arm64:
    name: Windows ARM64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Build release (cross to ARM64 via MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          if not defined VS (echo "Visual Studio not found" && exit /b 1)
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "target/aarch64-pc-windows-msvc/release/MarinExplorer.exe" "MarinExplorer-arm64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-arm64
          path: MarinExplorer-arm64.exe
          if-no-files-found: error

  # Packages the GNU x64 build into a real Windows installer with Inno Setup.
  # It needs no local tooling — the runner installs Inno Setup via winget.
  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: build-gnu-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Download the GNU x64 build
        uses: actions/download-artifact@v7
        with:
          name: MarinExplorer-x64-gnu
          path: target/x86_64-pc-windows-gnu/release

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v','' } else { '0.0.0-ci' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}","$env:LOCALAPPDATA\Programs" `
                  -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer/marin.iss "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/Oinstaller\Output"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-Setup
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/*.exe
