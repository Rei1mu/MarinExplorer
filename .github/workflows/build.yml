name: Build

# MarinExplorer targets Windows only, and ships two MSVC editions:
#   - x86_64-pc-windows-msvc   standard Windows x64, MSVC, built on a Windows runner
#   - aarch64-pc-windows-msvc  Windows on ARM64, MSVC, built on a Windows runner
#
# Both link the Microsoft C runtime statically (see the RUSTFLAGS below), so no
# "Visual C++ Redistributable" is needed on the target machine. Only the two
# setup.exe installers are published; bare exes are not.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Link the MSVC C runtime statically, so the .exe starts on a clean Windows
  # install that has no "Visual C++ Redistributable" present.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build-msvc-x86_64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build release
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          if not defined VS (echo "Visual Studio not found" && exit /b 1)
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "target/x86_64-pc-windows-msvc/release/MarinExplorer.exe" "MarinExplorer-x64-msvc.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-x64-msvc
          path: MarinExplorer-x64-msvc.exe
          if-no-files-found: error

  build-msvc-arm64:
    name: Windows ARM64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Build release (cross to ARM64 via MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          if not defined VS (echo "Visual Studio not found" && exit /b 1)
          call "%VS%\VC\Auxiliary\Build\vcvarsall.bat" x64_arm64
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: Copy-Item "target/aarch64-pc-windows-msvc/release/MarinExplorer.exe" "MarinExplorer-arm64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-arm64
          path: MarinExplorer-arm64.exe
          if-no-files-found: error

  # Packages each build into a real Windows installer with Inno Setup.
  # It needs no local tooling — the runner installs Inno Setup via winget, and the
  # installers are produced here in CI only (never built locally).
  #
  # One installer per architecture: the payload exe is not interchangeable.
  # Inno Setup 7 supports the arm64 architecture identifier natively, so ARM64
  # Windows 11 gets its own installer instead of relying on x64 emulation:
  #   - x64-msvc  → MSVC x64 build   (ArchitecturesAllowed=x64os)
  #   - arm64     → MSVC ARM64 build (ArchitecturesAllowed=arm64)
  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: [build-msvc-x86_64, build-msvc-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Download the MSVC x64 build
        uses: actions/download-artifact@v7
        with:
          name: MarinExplorer-x64-msvc
          path: target/x86_64-pc-windows-msvc/release

      - name: Download the ARM64 build
        uses: actions/download-artifact@v7
        with:
          name: MarinExplorer-arm64
          path: target/aarch64-pc-windows-msvc/release

      # The artifacts keep the published names; the .iss expects MarinExplorer.exe
      # in each target's release dir.
      - name: Stage payloads
        shell: pwsh
        run: |
          $dirs = @(
            "target\x86_64-pc-windows-msvc\release",
            "target\aarch64-pc-windows-msvc\release"
          )
          foreach ($d in $dirs) {
            Get-ChildItem $d -Filter *.exe | ForEach-Object {
              Rename-Item $_.FullName -NewName MarinExplorer.exe -Force
            }
            if (-not (Test-Path "$d\MarinExplorer.exe")) { throw "payload exe missing in $d" }
          }

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # Keep this numeric: it feeds VersionInfoVersion in the .iss.
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v','' } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installers
        shell: pwsh
        run: |
          # The runner may ship Inno Setup 6, whose default install lacks the
          # Chinese/Japanese language files that marin.iss compiles in. Prefer
          # Inno Setup 7 (installed above), or any build that actually has them.
          $cands = Get-ChildItem "$env:LOCALAPPDATA\Programs","${env:ProgramFiles(x86)}","$env:ProgramFiles" `
                    -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue
          if (-not $cands) { throw "ISCC.exe not found" }
          $withLang = $cands | Where-Object {
            Test-Path (Join-Path $_.DirectoryName "Languages\ChineseSimplified.isl")
          }
          $iscc = if ($withLang) { $withLang[0] } else { $cands[0] }
          Write-Output "using $($iscc.FullName)"
          Get-ChildItem (Join-Path $iscc.DirectoryName "Languages") -Filter *.isl -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          # x64 installer (MSVC payload).
          & $iscc.FullName installer/marin.iss "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppArch=x64-msvc" "/Oinstaller\Output"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for x64-msvc (exit $LASTEXITCODE)" }
          # ARM64 installer (MSVC payload). Inno Setup 7 supports the arm64
          # architecture natively, so no x64-emulation fallback is needed.
          & $iscc.FullName installer/marin.iss "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppArch=arm64" "/Oinstaller\Output"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for arm64 (exit $LASTEXITCODE)" }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MarinExplorer-Setup
          path: installer/Output/*.exe
          if-no-files-found: error

  # Publish everything exactly once.
  #
  # Why a separate job: several jobs uploading to the same release race each
  # other for the same asset list, and one of them silently loses. Collecting
  # all artifacts and attaching them from a single place is deterministic.
  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-msvc-x86_64
      - build-msvc-arm64
      - installer
    permissions:
      contents: write
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Show what we collected
        run: ls -la dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Only the two setup.exe installers — no bare exes.
          files: |
            dist/MarinExplorer-Setup-*.exe
